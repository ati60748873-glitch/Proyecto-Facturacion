
name: CI Facturación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas QA
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest

      - name: Auditar código con Flake8
        run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar pruebas con Pytest
        run: python -m pytest tests/test_facturacion_pytest.py
